[project]
name = "backend"
version = "0.1.0"
description = "Personal podcast generator backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "pydub>=0.25.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "tenacity>=9.1.4",
    "trafilatura>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false
